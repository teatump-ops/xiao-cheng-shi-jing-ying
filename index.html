<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>小城市经营静态版</title>
    <style>
      :root {
        --bg: #eef2ee;
        --panel: #ffffff;
        --panel-2: #f4f7f2;
        --ink: #22301f;
        --ink-soft: #5a6a55;
        --line: #d5ddd0;
        --accent: #2e7d46;
        --accent-ink: #ffffff;
        --gold: #b97f16;
        --danger: #b23a2e;
        --warn: #a86a12;
        --good: #2e7d46;
        --chip: #e7eee3;
        --shadow: 0 2px 10px rgba(34, 48, 31, .10);
        --radius: 10px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141a14;
          --panel: #1e261e;
          --panel-2: #242e24;
          --ink: #e4ecdf;
          --ink-soft: #9db098;
          --line: #39463a;
          --accent: #4caf6d;
          --accent-ink: #0d150d;
          --gold: #d9a441;
          --danger: #e0705f;
          --warn: #d9a441;
          --good: #6fce8b;
          --chip: #2a362a;
          --shadow: 0 2px 10px rgba(0, 0, 0, .45);
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
        font-size: 15px;
        line-height: 1.55;
      }
      button, select, input, textarea { font: inherit; color: inherit; }
      button { min-height: 2.25rem; cursor: pointer; }
      .wrap { max-width: 1240px; margin: 0 auto; padding: 12px 14px 40px; }

      /* ---------- top stats bar ---------- */
      .statsbar {
        display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px;
      }
      .chip {
        background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
        padding: 6px 12px; box-shadow: var(--shadow); min-width: 96px;
      }
      .chip .k { font-size: 12px; color: var(--ink-soft); display: block; }
      .chip .v { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
      .chip .v small { font-size: 12px; font-weight: 400; color: var(--ink-soft); }
      .v.bad { color: var(--danger); }
      .v.warn { color: var(--warn); }
      .v.good { color: var(--good); }

      /* ---------- layout ---------- */
      .layout { display: grid; grid-template-columns: minmax(0, 1fr) 368px; gap: 14px; align-items: start; }
      @media (max-width: 920px) { .layout { grid-template-columns: minmax(0, 1fr); } }

      .card {
        background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
        box-shadow: var(--shadow); padding: 12px;
      }
      .card h2 { font-size: 16px; margin: 0 0 8px; }
      .card h3 { font-size: 14px; margin: 14px 0 6px; }

      /* ---------- 3D stage ---------- */
      #stageWrap { position: relative; padding: 0; overflow: hidden; }
      #stage { width: 100%; height: 520px; display: block; touch-action: none; border-radius: var(--radius); }
      @media (max-width: 920px) { #stage { height: 400px; } }
      #stageFallback {
        display: none; padding: 28px 16px; text-align: center; color: var(--ink-soft);
      }
      .stage-hint {
        position: absolute; left: 10px; bottom: 8px; font-size: 12px; color: #fff;
        background: rgba(20, 30, 20, .55); padding: 3px 9px; border-radius: 999px; pointer-events: none;
      }
      .controls-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
      .btn {
        border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px;
        padding: 6px 14px; font-weight: 600;
      }
      .btn:hover { border-color: var(--accent); }
      .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-size: 16px; padding: 8px 22px; }
      .btn.danger { color: var(--danger); }
      .btn:disabled { opacity: .45; cursor: not-allowed; }
      .btn.small { min-height: 2rem; padding: 3px 10px; font-size: 13px; font-weight: 500; }

      /* ---------- tile panel ---------- */
      #tilePanel { margin-top: 14px; }
      .tile-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
      .tile-head .pos { color: var(--ink-soft); font-size: 13px; }
      .kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 4px 14px; margin: 8px 0; }
      .kv div { display: flex; justify-content: space-between; border-bottom: 1px dashed var(--line); padding: 2px 0; }
      .kv span:first-child { color: var(--ink-soft); }
      .kv span:last-child { font-weight: 600; font-variant-numeric: tabular-nums; }
      .build-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 8px; margin-top: 8px; }
      .build-item {
        text-align: left; border: 1px solid var(--line); background: var(--panel-2);
        border-radius: 8px; padding: 8px 10px; min-height: 4.2rem;
      }
      .build-item:hover:not(:disabled) { border-color: var(--accent); }
      .build-item .bn { font-weight: 700; display: flex; justify-content: space-between; }
      .build-item .bn .cost { color: var(--gold); font-variant-numeric: tabular-nums; }
      .build-item .bd { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
      .build-item:disabled { opacity: .5; cursor: not-allowed; }
      .note { font-size: 13px; color: var(--ink-soft); }
      .note.warn { color: var(--warn); }
      .note.bad { color: var(--danger); }
      .note.good { color: var(--good); }

      /* ---------- sidebar tabs ---------- */
      .tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 10px; }
      .tab {
        border: 1px solid var(--line); background: var(--panel-2); border-radius: 999px;
        padding: 4px 14px; font-weight: 600; min-height: 2.25rem;
      }
      .tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
      table.stat { width: 100%; border-collapse: collapse; font-size: 14px; }
      table.stat th, table.stat td { padding: 5px 6px; border-bottom: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; }
      table.stat th:first-child, table.stat td:first-child { text-align: left; }
      table.stat th { color: var(--ink-soft); font-weight: 500; font-size: 12px; }
      .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
      .breakdown { list-style: none; margin: 0; padding: 0; }
      .breakdown li { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed var(--line); }
      .breakdown .val { font-weight: 700; font-variant-numeric: tabular-nums; }
      .pos-v { color: var(--good); } .neg-v { color: var(--danger); } .zero-v { color: var(--ink-soft); }
      .needs { list-style: none; margin: 0; padding: 0; }
      .needs li { padding: 6px 0 6px 20px; position: relative; border-bottom: 1px dashed var(--line); }
      .needs li::before { content: ""; position: absolute; left: 2px; top: 13px; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
      .needs li.ok::before { background: var(--good); }
      textarea.savecode {
        width: 100%; min-height: 84px; border: 1px solid var(--line); border-radius: 8px;
        background: var(--panel-2); padding: 8px; font-size: 12px; word-break: break-all;
      }
      .msg { min-height: 1.4em; font-size: 13px; margin-top: 6px; }

      /* ---------- flat map: city block + surrounding terrain ---------- */
      .flat-scene {
        background: #7d8f6d; border: 1px solid var(--line); border-radius: 10px;
        padding: 8px; overflow: hidden;
      }
      @media (prefers-color-scheme: dark) { .flat-scene { background: #2c3a2a; } }
      .flat-world-wrap { position: relative; }
      /* gap colour reads as the road network between blocks */
      #flatGrid {
        display: grid; grid-template-columns: repeat(16, 1fr); gap: 2px;
        background: #5b6058; padding: 2px; border-radius: 6px;
      }
      @media (prefers-color-scheme: dark) { #flatGrid { background: #3a3f3a; } }
      #flatGrid button {
        min-height: 0; height: auto; aspect-ratio: 1; border: 1px solid rgba(30,40,25,.35);
        border-radius: 3px; font-size: 10px; padding: 0; line-height: 1.1; overflow: hidden;
        background: #a9bd8f; color: var(--ink); position: relative; cursor: pointer;
      }
      #flatGrid button .bt-roof { position: absolute; left: 0; right: 0; top: 0; height: 22%; opacity: .9; }
      #flatGrid button .bt-name {
        position: absolute; inset: 18% 0 12%; display: flex; align-items: center; justify-content: center;
        font-weight: 700; font-size: 11px; text-shadow: 0 1px 2px rgba(255,255,255,.45);
      }
      #flatGrid button .bt-lv {
        position: absolute; left: 0; right: 0; bottom: 0; font-size: 8px; text-align: center;
        background: rgba(20,26,18,.45); color: #fff; line-height: 1.5;
      }
      #flatGrid button.empty {
        background:
          radial-gradient(circle at 30% 35%, rgba(255,255,255,.20) 0 2px, transparent 3px),
          radial-gradient(circle at 70% 65%, rgba(60,90,40,.25) 0 2px, transparent 3px),
          #a9bd8f;
        color: rgba(40,55,32,.55);
      }
      @media (prefers-color-scheme: dark) { #flatGrid button.empty { background-color: #4d5f42; color: rgba(220,235,205,.5); } }
      #flatGrid button.sel { outline: 2px solid #f2c230; outline-offset: -2px; z-index: 2; }
      #flatGrid button.polluted { box-shadow: inset 0 0 0 3px #d9b81e; }
      #flatGrid button.polluted .bt-name { color: #4a3d05; }
      /* terrain outside the 12x12 city grid */
      .terrain {
        aspect-ratio: 1; border-radius: 2px; display: flex; align-items: center; justify-content: center;
        font-size: 9px; line-height: 1; overflow: hidden; user-select: none;
      }
      .terrain.forest  { background: #2f5d33; color: #9ed09a; letter-spacing: -2px; }
      .terrain.forest2 { background: #3a6f3e; color: #b7e2ae; letter-spacing: -2px; }
      .terrain.waste   { background: #c9b586; color: #8a7648; background-image: radial-gradient(circle at 40% 40%, rgba(120,95,50,.35) 0 1.5px, transparent 2.5px), radial-gradient(circle at 75% 70%, rgba(120,95,50,.3) 0 1.5px, transparent 2.5px); }
      .terrain.scrub   { background: #97a86f; color: #5d7038; }
      .terrain.rock    { background: #9b968b; color: #6d675c; }
      @media (prefers-color-scheme: dark) {
        .terrain.forest { background: #1f4224; } .terrain.forest2 { background: #26502b; }
        .terrain.waste { background: #6e6244; color: #c9b586; } .terrain.scrub { background: #4a5a35; color: #a9bd8f; }
        .terrain.rock { background: #55524b; color: #a09a8e; }
      }
      /* vehicles on the roads right next to buildings (flat view) */
      #flatCars { position: absolute; inset: 2px; pointer-events: none; z-index: 3; }
      .flat-car { position: absolute; width: 4.6%; aspect-ratio: 2.1; margin-left: -2.3%; margin-top: -1.1%; }
      .flat-car .car-body {
        width: 100%; height: 100%; border-radius: 3px; position: relative;
        box-shadow: 0 1px 2px rgba(0,0,0,.45); animation: flatDrive 3.2s ease-in-out infinite alternate;
      }
      .flat-car .car-body::before {
        content: ""; position: absolute; left: 26%; right: 26%; top: 18%; bottom: 18%;
        background: #2c3540; border-radius: 2px;
      }
      .flat-car.vert .car-body { transform: rotate(90deg); animation-name: flatDriveV; }
      @keyframes flatDrive { from { transform: translateX(-14%); } to { transform: translateX(14%); } }
      @keyframes flatDriveV { from { transform: rotate(90deg) translateX(-14%); } to { transform: rotate(90deg) translateX(14%); } }
      @media (prefers-reduced-motion: reduce) { .flat-car .car-body { animation: none; } }
      #flatMeta { font-size: 13px; margin-top: 8px; }
      .flat-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--ink-soft); margin-top: 6px; }
      .flat-legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }

      /* ---------- event modal ---------- */
      #eventOverlay {
        position: fixed; inset: 0; background: rgba(10, 16, 10, .55);
        display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50;
      }
      #eventOverlay.open { display: flex; }
      .event-card {
        background: var(--panel); color: var(--ink); border-radius: 14px; max-width: 560px; width: 100%;
        padding: 20px; box-shadow: 0 12px 40px rgba(0,0,0,.35); max-height: 88vh; overflow: auto;
      }
      .event-card h2 { margin: 0 0 4px; font-size: 20px; }
      .event-tag { font-size: 12px; color: var(--gold); font-weight: 700; letter-spacing: .08em; }
      .opt {
        display: block; width: 100%; text-align: left; border: 1px solid var(--line);
        background: var(--panel-2); border-radius: 10px; padding: 10px 12px; margin-top: 8px; min-height: 3.4rem;
      }
      .opt:hover { border-color: var(--accent); }
      .opt .ot { font-weight: 700; }
      .opt .od { font-size: 13px; color: var(--ink-soft); display: block; margin-top: 2px; }
      .opt .oe { font-size: 13px; display: block; margin-top: 4px; font-variant-numeric: tabular-nums; }
      #toast {
        position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(20px);
        background: var(--ink); color: var(--bg); padding: 9px 18px; border-radius: 999px;
        opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 60;
        max-width: 92vw; text-align: center; font-size: 14px;
      }
      #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
      .log { font-size: 13px; color: var(--ink-soft); max-height: 180px; overflow: auto; margin: 0; padding-left: 18px; }
      .log li { margin: 2px 0; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="statsbar" id="statsBar"></div>

      <div class="layout">
        <div>
          <div class="card" id="stageWrap">
            <canvas id="stage" aria-label="3D 城市地图：点击地块进行建设"></canvas>
            <div id="stageFallback">3D 视图没能加载，可以用「平面图」页签照常建设经营。</div>
            <div class="stage-hint">拖动旋转 · 滚轮/双指缩放 · 点击地块建设</div>
          </div>
          <div class="controls-row">
            <button class="btn primary" id="btnNextMonth">推进一个月 ▶</button>
            <button class="btn" id="btnResetCam">重置视角</button>
            <button class="btn" id="btnNewGame">重新开始</button>
          </div>
          <div class="card" id="tilePanel"></div>
          <div class="card" style="margin-top:14px">
            <h2>城市日志</h2>
            <ul class="log" id="cityLog"></ul>
          </div>
        </div>

        <div class="card">
          <div class="tabs" role="tablist">
            <button class="tab" role="tab" data-tab="stats" aria-selected="true">建筑统计</button>
            <button class="tab" role="tab" data-tab="sat" aria-selected="false">满意度解析</button>
            <button class="tab" role="tab" data-tab="needs" aria-selected="false">市民需求</button>
            <button class="tab" role="tab" data-tab="flat" aria-selected="false">平面图</button>
            <button class="tab" role="tab" data-tab="save" aria-selected="false">存档</button>
          </div>
          <div id="tab-stats"></div>
          <div id="tab-sat" hidden></div>
          <div id="tab-needs" hidden></div>
          <div id="tab-flat" hidden>
            <p class="note">和 3D 地图是同一座城市，点任意地块即可选中建设。格子之间的灰色细线是街道，黄框 = 该住宅受污染影响。</p>
            <div class="flat-scene">
              <div class="flat-world-wrap">
                <div id="flatGrid"></div>
                <div id="flatCars" aria-hidden="true"></div>
              </div>
              <div id="flatMeta"></div>
              <div class="flat-legend">
                <span><span class="sw" style="background:#2f5d33"></span>森林（城外）</span>
                <span><span class="sw" style="background:#c9b586"></span>荒地（城外）</span>
                <span><span class="sw" style="background:#a9bd8f"></span>空地草坪</span>
                <span><span class="sw" style="background:#5b6058"></span>街道</span>
              </div>
            </div>
          </div>
          <div id="tab-save" hidden>
            <h3 style="margin-top:0">存档码</h3>
            <p class="note">静态版的存档是一串代码：导出后自己收好，下次打开页面粘贴回来就能接着玩。</p>
            <textarea class="savecode" id="saveCode" placeholder="点「导出存档码」生成，或把之前的存档码粘贴到这里再点「导入」"></textarea>
            <div class="controls-row">
              <button class="btn" id="btnExport">导出存档码</button>
              <button class="btn" id="btnCopyCode">复制</button>
              <button class="btn" id="btnImport">导入</button>
            </div>
            <div class="msg" id="saveMsg"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="eventOverlay" role="dialog" aria-modal="true" aria-labelledby="eventTitle">
      <div class="event-card">
        <div class="event-tag">城市大事件</div>
        <h2 id="eventTitle"></h2>
        <p id="eventDesc"></p>
        <div id="eventOpts"></div>
      </div>
    </div>
    <div id="toast" role="status"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.149.0/three.min.js"></script>
    <script>
    "use strict";
    /* ============================================================
       小城市经营 · 静态版
       规则与带存档版一致：12×12 地块、建筑 5 级、位置污染、
       公园净化、生活便利、受教育度、大事件与市民口碑。
       ============================================================ */
    var SIZE = 12, N = SIZE * SIZE, MAXLV = 5;

    function mult(lv) { return 1 + 0.4 * (lv - 1); }
    function upCost(def, lv) { return Math.round(def.cost * 0.7 * lv / 5) * 5; }

    var DEFS = {
      house:   { name: "住宅",       cost: 100, upkeep: 2,  power: 2,  cap: 12, color: 0xd96f4e, roof: 0x9e3b26,
                 desc: "容纳 12 人 · 每位居民每月缴税 2" },
      luxury:  { name: "高级住宅区", cost: 320, upkeep: 8,  power: 5,  cap: 30, color: 0xe3b34c, roof: 0x8a6420,
                 desc: "容纳 30 人 · 每栋满意度 +2（上限 +6）" },
      shop:    { name: "商业街",     cost: 150, upkeep: 4,  power: 3,  jobs: 8,  income: 30, color: 0x4f9fd9, roof: 0x2b5f86,
                 desc: "岗位 8 · 月入 30 · 每座工厂 +10 税收（上限 +30）· 吃教育加成" },
      factory: { name: "工厂",       cost: 200, upkeep: 6,  power: 6,  jobs: 12, income: 55, color: 0x8d99a6, roof: 0x59636e,
                 desc: "岗位 12 · 月入 55 · 污染半径 2 格，不能紧挨住宅" },
      office:  { name: "办公楼",     cost: 260, upkeep: 6,  power: 5,  jobs: 14, income: 45, color: 0x7fb3c8, roof: 0x49707f,
                 desc: "岗位 14 · 月入 45 · 教育加成翻倍" },
      park:    { name: "公园",       cost: 80,  upkeep: 2,  power: 0,  capBonus: 2, color: 0x58a860, roof: 0x58a860,
                 desc: "城市容量 +2 · 紧挨住宅全额抵消污染，隔一格减半" },
      power:   { name: "发电厂",     cost: 250, upkeep: 8,  power: 0,  gen: 40, color: 0xb08968, roof: 0x6e5138,
                 desc: "发电 40 点" },
      wind:    { name: "风力发电机", cost: 180, upkeep: 3,  power: 0,  gen: 22, color: 0xdfe6ea, roof: 0xdfe6ea,
                 desc: "发电 22 点 · 清洁电力，维护便宜" },
      school:  { name: "学校",       cost: 180, upkeep: 6,  power: 3,  jobs: 6, color: 0xe0a458, roof: 0xa56c26,
                 desc: "岗位 6 · 提升受教育度 · 靠近住宅算上学便利" },
      library: { name: "图书馆",     cost: 140, upkeep: 4,  power: 2,  jobs: 3, color: 0xa879c9, roof: 0x6d4a8a,
                 desc: "岗位 3 · 与学校一起提升受教育度 · 文化满意度" },
      hospital:{ name: "医院",       cost: 220, upkeep: 8,  power: 4,  jobs: 8, color: 0xf0f0ee, roof: 0xc23b2e,
                 desc: "岗位 8 · 医疗覆盖加满意度 · 靠近住宅算就医便利" },
      police:  { name: "警察局",     cost: 160, upkeep: 6,  power: 2,  jobs: 5, color: 0x4a5f8a, roof: 0x2c3a57,
                 desc: "岗位 5 · 安全感 · 每座全城维护费 −4%（上限 −20%）" },
      fire:    { name: "消防站",     cost: 150, upkeep: 5,  power: 2,  jobs: 4, color: 0xd94f3d, roof: 0x8f2a1e,
                 desc: "岗位 4 · 安全感 · 工厂事故赔付减半" },
      stadium: { name: "体育馆",     cost: 300, upkeep: 10, power: 6,  jobs: 10, color: 0x3fa08c, roof: 0x256355,
                 desc: "岗位 10 · 满意度 +4 · 门票月入 = 人口 × 0.25" }
    };
    var ORDER = ["house","luxury","shop","factory","office","park","power","wind","school","library","hospital","police","fire","stadium"];
    var RES_TYPES = { house: 1, luxury: 1 };

    /* ---------------- state ---------------- */
    var S;
    function newState() {
      return {
        funds: 900, month: 1, pop: 0, reputation: 0,
        grid: new Array(N).fill(null),
        recentEvents: [], log: ["城市成立。第 1 个月，从第一栋住宅开始规划吧。"],
        totalEvents: 0
      };
    }
    S = newState();
    var selected = -1;

    function idx(x, y) { return y * SIZE + x; }
    function xy(i) { return [i % SIZE, Math.floor(i / SIZE)]; }
    function cheb(a, b) { var p = xy(a), q = xy(b); return Math.max(Math.abs(p[0]-q[0]), Math.abs(p[1]-q[1])); }
    function tilesOf(type) { var r = []; for (var i = 0; i < N; i++) if (S.grid[i] && S.grid[i].type === type) r.push(i); return r; }
    function residences() { var r = []; for (var i = 0; i < N; i++) if (S.grid[i] && RES_TYPES[S.grid[i].type]) r.push(i); return r; }
    function addLog(t) { S.log.unshift("第 " + S.month + " 月：" + t); if (S.log.length > 40) S.log.pop(); }

    /* ---------------- derived stats ---------------- */
    function compute() {
      var c = { counts: {}, lvSum: {}, capacity: 0, jobs: 0, gen: 0, use: 0, upkeepRaw: 0 };
      ORDER.forEach(function (t) { c.counts[t] = 0; c.lvSum[t] = 0; });
      for (var i = 0; i < N; i++) {
        var b = S.grid[i]; if (!b) continue;
        var d = DEFS[b.type], m = mult(b.level);
        c.counts[b.type]++; c.lvSum[b.type] += b.level;
        if (d.cap) c.capacity += Math.round(d.cap * m);
        if (d.capBonus) c.capacity += d.capBonus;
        if (d.jobs) c.jobs += Math.round(d.jobs * m);
        if (d.gen) c.gen += Math.round(d.gen * m);
        c.use += Math.round((d.power || 0) * m);
        c.upkeepRaw += Math.round(d.upkeep * m);
      }
      c.powerOk = c.gen >= c.use;
      c.powerFactor = c.powerOk ? 1 : 0.5;
      c.policeCut = Math.min(0.20, c.counts.police * 0.04);
      c.upkeep = Math.round(c.upkeepRaw * (1 - c.policeCut));

      /* education */
      if (S.pop <= 0) c.education = (c.counts.school + c.counts.library) > 0 ? 50 : 0;
      else c.education = Math.max(0, Math.min(100, Math.round((c.lvSum.school * 45 + c.lvSum.library * 25) / S.pop * 100)));
      c.eduBonus = c.education / 100 * 0.25;

      /* pollution & parks */
      var facs = tilesOf("factory"), parks = tilesOf("park"), res = residences();
      c.resInfo = {};
      c.totalRaw = 0; c.totalRemain = 0; c.totalOffset = 0; c.cleaned = 0; c.pollutedHomes = 0;
      res.forEach(function (r) {
        var raw = 0, off = 0, j;
        for (j = 0; j < facs.length; j++) { var dd = cheb(r, facs[j]); if (dd === 1) raw += 2; else if (dd === 2) raw += 1; }
        for (j = 0; j < parks.length; j++) {
          var pd = cheb(r, parks[j]), plv = S.grid[parks[j]].level, full = 1 + 0.5 * (plv - 1);
          if (pd === 1) off += full; else if (pd === 2) off += full / 2;
        }
        var applied = Math.min(raw, off), remain = raw - applied;
        c.resInfo[r] = { raw: raw, off: applied, remain: remain };
        c.totalRaw += raw; c.totalRemain += remain; c.totalOffset += applied;
        if (raw > 0 && remain <= 0) c.cleaned++;
        if (remain > 0) c.pollutedHomes++;
      });
      c.factoryNearRes = false;
      facs.forEach(function (f) { res.forEach(function (r) { if (cheb(f, r) <= 2) c.factoryNearRes = true; }); });

      /* convenience: school / shop / hospital proximity */
      c.conv = {};
      ["school", "shop", "hospital"].forEach(function (t) {
        var ts = tilesOf(t), served = 0, scoreSum = 0;
        res.forEach(function (r) {
          var best = 99;
          ts.forEach(function (o) { var d2 = cheb(r, o); if (d2 < best) best = d2; });
          var sc = best <= 1 ? 1 : best === 2 ? 0.5 : 0;
          scoreSum += sc; if (sc > 0) served++;
        });
        c.conv[t] = { count: ts.length, served: served, avg: res.length ? scoreSum / res.length : 0, tiles: ts };
      });
      c.homesAllConv = 0;
      res.forEach(function (r) {
        var all = true;
        ["school", "shop", "hospital"].forEach(function (t) {
          var best = 99;
          c.conv[t].tiles.forEach(function (o) { var d2 = cheb(r, o); if (d2 < best) best = d2; });
          if (best > 2) all = false;
        });
        if (all && res.length) c.homesAllConv++;
      });
      c.resCount = res.length;

      /* monthly income preview */
      c.incomeTax = Math.round(S.pop * 2);
      c.incomeBiz = 0;
      ["shop", "factory", "office"].forEach(function (t) {
        tilesOf(t).forEach(function (i2) {
          var d = DEFS[t], b = S.grid[i2];
          var inc = d.income * mult(b.level);
          var eduF = t === "office" ? 1 + c.eduBonus * 2 : 1 + c.eduBonus;
          c.incomeBiz += inc * eduF;
        });
      });
      if (c.counts.shop && c.counts.factory) c.incomeBiz += c.counts.shop * Math.min(30, c.counts.factory * 10);
      c.incomeBiz = Math.round(c.incomeBiz * c.powerFactor);
      c.incomeStadium = Math.round(c.counts.stadium ? S.pop * 0.25 * (1 + 0.4 * (avgLv("stadium") - 1)) : 0);
      c.income = c.incomeTax + c.incomeBiz + c.incomeStadium;
      c.net = c.income - c.upkeep;

      c.sat = satisfaction(c);
      return c;
    }
    function avgLv(t) { var ts = tilesOf(t); if (!ts.length) return 1; var s = 0; ts.forEach(function (i) { s += S.grid[i].level; }); return s / ts.length; }

    function satisfaction(c) {
      var items = [];
      function add(label, v) { items.push({ label: label, v: Math.round(v) }); }
      if (S.pop > 0) {
        add("住房供给", c.capacity >= S.pop ? 5 : -Math.min(20, Math.ceil((S.pop - c.capacity) / 4)));
        if (S.pop >= 10) {
          var emp = Math.min(1, c.jobs / Math.max(1, S.pop * 0.7));
          add("就业", Math.max(-15, Math.min(8, (emp - 0.7) * 30)));
        }
      } else add("住房供给", 0);
      add("电力供应", c.use === 0 ? 0 : (c.powerOk ? 2 : -12));
      if (c.totalRemain > 0) add("工厂污染", -Math.min(18, c.totalRemain * 1.5));
      else if (c.counts.factory > 0 && !c.factoryNearRes) add("工厂选址（远离住宅）", 3);
      else if (c.counts.factory > 0) add("工厂污染", 0);
      if (c.cleaned > 0) add("公园净化", Math.min(6, c.cleaned));
      if (c.resCount > 0) {
        add("上学便利", c.conv.school.avg * 8);
        add("购物便利", c.conv.shop.avg * 8);
        add("就医便利", c.conv.hospital.avg * 8);
      }
      ["school", "shop", "hospital"].forEach(function (t) {
        if (c.conv[t].count > 0 && c.conv[t].served === 0 && c.resCount > 0)
          add(DEFS[t].name + "离住宅太远", -3);
      });
      if (c.counts.luxury) add("高级住宅区品质", Math.min(6, c.counts.luxury * 2));
      if (c.counts.park && S.pop > 0) add("公园绿化", Math.min(5, c.counts.park));
      if (c.counts.library && S.pop > 0) add("文化氛围（图书馆）", Math.min(5, c.counts.library * 2));
      if (S.pop > 0 && c.counts.hospital) add("医疗覆盖", Math.min(6, c.lvSum.hospital * 60 / S.pop * 6));
      if (S.pop > 0 && (c.counts.police || c.counts.fire))
        add("安全感（警察/消防）", Math.min(6, (c.lvSum.police + c.lvSum.fire) * 50 / S.pop * 6));
      if (S.pop > 0) add("受教育度", (c.education >= 30 || S.pop < 10) ? c.education / 100 * 8 : -5);
      if (c.counts.stadium) add("体育馆", 4);
      add("大事抉择口碑", S.reputation);
      if (S.funds < 0) add("财政赤字", -10);
      var total = 50;
      items.forEach(function (it) { total += it.v; });
      return { total: Math.max(0, Math.min(100, total)), items: items };
    }

    /* citizen needs */
    function needsList(c) {
      var n = [];
      if (c.resCount === 0) n.push("还没有住宅，先盖一栋住宅，市民才会搬进来。");

      if (c.use > c.gen) n.push("电力不足（用 " + c.use + " / 发 " + c.gen + "）：商业和工厂收入减半，盖发电厂或风力发电机。");
      if (c.pollutedHomes > 0) n.push(c.pollutedHomes + " 栋住宅正受工厂污染，在它们旁边盖公园可以抵消，污染越少满意度越高。");
      if (c.resCount > 0) {
        ["school", "shop", "hospital"].forEach(function (t) {
          var far = c.resCount - c.conv[t].served;
          if (c.conv[t].count === 0) n.push("全城还没有" + DEFS[t].name + "，在住宅 2 格内盖一座能涨满意度。");
          else if (far > 0) n.push(far + " 栋住宅离最近的" + DEFS[t].name + "超过 2 格，享受不到生活便利。");
        });
      }
      if (S.pop > 0 && c.jobs < S.pop * 0.7) n.push("岗位不足：现有岗位 " + c.jobs + "，盖商业街、工厂或办公楼能提供工作。");
      if (S.pop > 20 && c.education < 40) n.push("受教育度偏低（" + c.education + "%）：多盖学校和图书馆，还能给商业、工厂、办公楼加收入。");
      if (S.pop > 0 && !c.counts.hospital) n.push("没有医院，市民看病没着落。");
      if (S.pop > 0 && !c.counts.park) n.push("没有公园，市民没有散步的地方，公园还能抵消工厂污染。");
      if (S.reputation <= -10) n.push("市民口碑很差（" + S.reputation + "），在大事件里多选为市民着想的方案能慢慢挽回。");
      if (n.length === 0) n.push("市民暂时没什么大意见，城市运转良好。");
      return n;
    }

    var pendingEvent = null;

    function rollEvent(c) {
      if (S.month <= 2) return;
      if (Math.random() > 0.30) return;
      var pool = EVENTS.filter(function (e) {
        return S.recentEvents.indexOf(e.id) < 0 && (!e.when || e.when(c));
      });
      if (!pool.length) return;
      pendingEvent = pool[Math.floor(Math.random() * pool.length)];
      showEvent(pendingEvent);
    }
    function showEvent(ev) {
      document.getElementById("eventTitle").textContent = ev.title;
      document.getElementById("eventDesc").textContent = ev.desc;
      var box = document.getElementById("eventOpts");
      box.innerHTML = "";
      ev.opts.forEach(function (o) {
        var b = document.createElement("button");
        b.className = "opt";
        var eff = [];
        if (o.funds) eff.push("资金 " + (o.funds > 0 ? "+" : "") + o.funds);
        if (o.rep) eff.push("口碑 " + (o.rep > 0 ? "+" : "") + o.rep);
        if (o.pop) eff.push("人口 " + (o.pop > 0 ? "+" : "") + o.pop);
        b.innerHTML = "<span class='ot'></span><span class='od'></span><span class='oe'></span>";
        b.children[0].textContent = o.t;
        b.children[1].textContent = o.d;
        b.children[2].textContent = eff.join(" · ") || "无直接影响";
        b.addEventListener("click", function () { resolveEvent(ev, o); });
        box.appendChild(b);
      });
      document.getElementById("eventOverlay").classList.add("open");
    }
    function resolveEvent(ev, o) {
      S.funds += o.funds;
      S.reputation = Math.max(-25, Math.min(25, S.reputation + o.rep));
      if (o.pop) {
        var c = compute();
        S.pop = Math.max(0, Math.min(c.capacity, S.pop + o.pop));
      }
      S.recentEvents.push(ev.id);
      if (S.recentEvents.length > 4) S.recentEvents.shift();
      S.totalEvents++;
      pendingEvent = null;
      document.getElementById("eventOverlay").classList.remove("open");
      addLog("大事件「" + ev.title + "」选择了「" + o.t + "」（口碑 " + (S.reputation >= 0 ? "+" : "") + S.reputation + "）。");
      toast("已处理：" + ev.title);
      refresh();
    }

    /* ---------------- monthly tick ---------------- */
    function nextMonth() {
      if (pendingEvent) { toast("先处理大事件再推进。"); return; }
      var c = compute();
      S.funds += c.net;
      /* population drift */
      var sat = c.sat.total, newPop = S.pop;
      if (c.capacity > S.pop) {
        var rate = sat >= 60 ? 0.22 : sat >= 45 ? 0.10 : sat >= 30 ? 0.03 : -0.05;
        newPop = S.pop + Math.ceil((c.capacity - S.pop) * rate);
        if (sat < 30) newPop = Math.floor(S.pop * 0.95);
      } else if (c.capacity < S.pop) newPop = c.capacity;
      else if (sat < 30) newPop = Math.floor(S.pop * 0.94);
      S.pop = Math.max(0, newPop);
      S.month++;
      addLog("月结：收入 " + c.income + "，维护 " + c.upkeep + "，净 " + (c.net >= 0 ? "+" : "") + c.net + "；人口 " + S.pop + "，满意度 " + compute().sat.total + "。");
      rollEvent(compute());
      refresh();
    }

    /* ---------------- build rules ---------------- */
    function buildBlockReason(type, i) {
      var d = DEFS[type];
      if (S.funds < d.cost) return "资金不足（需要 " + d.cost + "）";
      if (type === "factory") {
        var res = residences();
        for (var j = 0; j < res.length; j++) if (cheb(i, res[j]) <= 1) return "工厂不能紧挨住宅建（污染太重），换个离住宅远一点的地块。";
      }
      if (RES_TYPES[type]) {
        var facs = tilesOf("factory");
        for (var k = 0; k < facs.length; k++) if (cheb(i, facs[k]) <= 1) return "住宅不能紧挨工厂建（污染太重），换个地块或先拆工厂。";
      }

        peds.push({ g: g, horiz: Math.random() < 0.5, fixed: (Math.floor(Math.random() * (SIZE + 1)) - SIZE / 2) * GAP + 0.32,
                    t: Math.random() * SIZE * GAP - SIZE * GAP / 2, dir: Math.random() < 0.5 ? 1 : -1,
                    speed: 0.35 + Math.random() * 0.4, phase: Math.random() * 6 });
      }
    }
    function makeCars() {
      var cols = [0xd94f3d, 0x2b7fd4, 0xf2f5f7, 0xf2c230, 0x39b5a8, 0x8d99a6];
      var lanes = [-GAP * 2.5, -GAP * 0.5, GAP * 1.5];
      for (var i = 0; i < 7; i++) {
        var g = new THREE.Group();
        var col = cols[i % cols.length];
        g.add(box(0.42, 0.13, 0.2, col, 0, 0.13, 0));
        g.add(box(0.22, 0.11, 0.18, 0x2c3540, -0.02, 0.24, 0, { roughness: 0.3, metalness: 0.4 }));
        [[-0.14, -0.1], [0.14, -0.1], [-0.14, 0.1], [0.14, 0.1]].forEach(function (wp) {
          var w = cyl(0.045, 0.045, 0.03, 0x1c1f24, wp[0], 0.05, wp[1], 10);
          w.rotation.x = Math.PI / 2; g.add(w);
        });
        scene.add(g);
        cars.push({ g: g, lane: lanes[i % lanes.length], horiz: i % 2 === 0,
                    t: Math.random() * SIZE * GAP - SIZE * GAP / 2, dir: i % 3 === 0 ? -1 : 1,
                    speed: 1.1 + Math.random() * 0.7 });
      }
    }
    function makeSmoke() {
      var cv = document.createElement("canvas"); cv.width = cv.height = 64;
      var ctx = cv.getContext("2d");
      var grad = ctx.createRadialGradient(32, 32, 4, 32, 32, 30);
      grad.addColorStop(0, "rgba(230,230,230,.75)"); grad.addColorStop(1, "rgba(230,230,230,0)");
      ctx.fillStyle = grad; ctx.fillRect(0, 0, 64, 64);
      var tex = new THREE.CanvasTexture(cv);
      for (var i = 0; i < 42; i++) {
        var sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
        sp.visible = false; scene.add(sp);
        smokePool.push({ sp: sp, life: Math.random(), src: null });
      }
    }
    var smokeSources = [];
    function animate(t) {
      requestAnimationFrame(animate);
      var time = (t || 0) / 1000;
      turbines.forEach(function (h) { h.rotation.z += 0.06; });
      /* pedestrians */
      var c = three.cache;
      var want = 0;
      if (c) want = Math.max(0, Math.min(36, Math.round(36 * (c.capacity ? S.pop / c.capacity : 0))));
      var lim = SIZE * GAP / 2 - 0.4;
      peds.forEach(function (p, i2) {
        p.g.visible = i2 < want;
        if (!p.g.visible) return;
        p.t += p.dir * p.speed * 0.016;
        if (p.t > lim) { p.t = lim; p.dir = -1; }
        if (p.t < -lim) { p.t = -lim; p.dir = 1; }
        var bob = Math.abs(Math.sin(time * 7 + p.phase)) * 0.03;
        if (p.horiz) { p.g.position.set(p.t, 0.05 + bob, p.fixed); p.g.rotation.y = p.dir > 0 ? Math.PI / 2 : -Math.PI / 2; }
        else { p.g.position.set(p.fixed, 0.05 + bob, p.t); p.g.rotation.y = p.dir > 0 ? 0 : Math.PI; }
      });
      /* cars: appear only once population & building thresholds are met,
         and only the first N of them (they drive roads beside buildings) */
      var vi3 = c ? vehicleInfo(c) : { unlocked: false, count: 0 };
      cars.forEach(function (car, ci) {
        car.g.visible = vi3.unlocked && ci < vi3.count;
        if (!car.g.visible) return;
        car.t += car.dir * car.speed * 0.016;
        if (car.t > lim + 1) car.t = -lim - 1;
        if (car.t < -lim - 1) car.t = lim + 1;
        if (car.horiz) { car.g.position.set(car.t, 0.02, car.lane + (car.dir > 0 ? 0.14 : -0.14)); car.g.rotation.y = car.dir > 0 ? 0 : Math.PI; }
        else { car.g.position.set(car.lane + (car.dir > 0 ? -0.14 : 0.14), 0.02, car.t); car.g.rotation.y = car.dir > 0 ? -Math.PI / 2 : Math.PI / 2; }
      });
      /* smoke */
      var srcIdx = 0;
      smokePool.forEach(function (s) {
        if (!smokeSources.length) { s.sp.visible = false; return; }
        s.src = smokeSources[srcIdx % smokeSources.length]; srcIdx++;
        s.life += 0.006;
        if (s.life > 1) s.life = 0;
        var src = s.src;
        s.sp.visible = true;
        s.sp.position.set(src.x + Math.sin(time * 0.8 + s.life * 5) * 0.12 * s.life, src.y + s.life * 1.1, src.z);
        var sc = 0.22 + s.life * 0.55;
        s.sp.scale.set(sc, sc, 1);
        s.sp.material.opacity = 0.65 * (1 - s.life);
      });
      updateCamera();
      renderer.render(scene, camera);
    }

    /* rebuild 3D tiles from state */
    function syncThree(c) {
      if (!three.ok) return;
      three.cache = c;
      /* park each car on a road directly beside a built tile */
      var rowRoads = [], colRoads = [];
      for (var bi = 0; bi < N; bi++) {
        if (!S.grid[bi]) continue;
        var bp = wpos(bi);
        var rz = bp[1] + GAP / 2, cx = bp[0] + GAP / 2;
        if (rowRoads.indexOf(rz) < 0) rowRoads.push(rz);
        if (colRoads.indexOf(cx) < 0) colRoads.push(cx);
      }
      cars.forEach(function (car, ci) {
        var pool = car.horiz ? rowRoads : colRoads;
        if (pool.length) car.lane = pool[ci % pool.length];
      });
      smokeSources = [];
      turbines = turbines.filter(function (h) { return h.parent !== null; });
      for (var i = 0; i < N; i++) {
        var b = S.grid[i];
        var old = tileGroups[i];
        var key = b ? b.type + ":" + b.level : "";
        if (old && old.userData.key === key) { /* unchanged */ }
        else {
          if (old) { scene.remove(old); tileGroups[i] = null; }
          if (markerSprites[i]) { scene.remove(markerSprites[i]); markerSprites[i] = null; }
          if (b) {
            var g = buildModel(b.type, b.level);
            var p = wpos(i);
            g.position.set(p[0], 0.05, p[1]);
            g.userData.key = key;
            scene.add(g); tileGroups[i] = g;
            if (g.userData.chimney) {
              var cp = g.userData.chimney.clone(); cp.x += p[0]; cp.z += p[1]; cp.y += 0.05;
              smokeSources.push(cp);
            }
          }
        }
        if (b && tileGroups[i] && tileGroups[i].userData.chimney && !old) { /* handled above */ }
        /* markers */
        var wantTxt = "", wantCol = "#ffffff";
        if (b) {
          var parts = [];
          if (RES_TYPES[b.type] && c.resInfo[i] && c.resInfo[i].remain > 0) { parts.push("污"); }
          if (RES_TYPES[b.type] && isAllConv(i, c)) parts.push("便");
          parts.push("Lv" + b.level);
          wantTxt = parts.join(" ");
          wantCol = (c.resInfo[i] && c.resInfo[i].remain > 0 && RES_TYPES[b.type]) ? "#ff9d8a" : "#ffffff";
        }
        var cur = markerSprites[i];
        if (wantTxt && (!cur || cur.userData.txt !== wantTxt)) {
          if (cur) scene.remove(cur);
          var sp = textSprite(wantTxt, wantCol);
          var pp = wpos(i);
          sp.position.set(pp[0], 1.95, pp[1]);
          sp.userData.txt = wantTxt;
          scene.add(sp); markerSprites[i] = sp;
        } else if (!wantTxt && cur) { scene.remove(cur); markerSprites[i] = null; }
        /* pad highlight */
        var pad = three.pads[i];
        if (pad) {
          if (i === selected) pad.material = three.hlMat;
          else if (b && RES_TYPES[b.type] && c.resInfo[i] && c.resInfo[i].remain > 0) pad.material = three.polMat;
          else pad.material = three.padMat;
        }
      }
      /* collect smoke sources fresh (chimneys of current groups) */
      smokeSources = [];
      for (var j = 0; j < N; j++) {
        var tg = tileGroups[j];
        if (tg && tg.userData.chimney) {
          var q = wpos(j), cp2 = tg.userData.chimney.clone();
          cp2.x += q[0]; cp2.z += q[1]; cp2.y += 0.05;
          smokeSources.push(cp2);
        }
      }
      turbines = [];
      for (var k = 0; k < N; k++) { var tg2 = tileGroups[k]; if (tg2 && tg2.userData.hub) turbines.push(tg2.userData.hub); }
    }

    var VEH_POP_MIN = 25, VEH_BLD_MIN = 8;
    function vehicleInfo(c) {

      var unlocked = S.pop >= VEH_POP_MIN && total >= VEH_BLD_MIN;

    /* road segments hugging a building: south edge (horizontal road)
       or east edge (vertical road) of a built tile, in world coords
       where the world is 16x16 (2 terrain tiles of border + 12 city) */
    function buildingRoads() {
      var roads = [];
      for (var i = 0; i < N; i++) {
        if (!S.grid[i]) continue;
        var p = xy(i), wx = p[0] + 2, wy = p[1] + 2;
        roads.push({ horiz: true,  x: wx + 0.5, y: wy + 1.02 });
        roads.push({ horiz: false, x: wx + 1.02, y: wy + 0.5 });
      }
      return roads;
    }

    /* ---- terrain outside the city grid: forest / wasteland / scrub / rock,
       fixed per position so the landscape never reshuffles ---- */
    function terrainAt(wx, wy) {
      var h = Math.abs(Math.sin(wx * 127.1 + wy * 311.7) * 43758.5453) % 1;
      /* north & west edges lean forest, south & east lean dry wasteland */
      var forestBias = (wx + wy < 14) ? 0.12 : -0.10;
      if (h < 0.42 + forestBias) return { cls: h < 0.22 ? "forest" : "forest2", txt: "♠♠" };
      if (h < 0.68) return { cls: "waste", txt: "···" };
      if (h < 0.86) return { cls: "scrub", txt: "〰" };
      return { cls: "rock", txt: "●" };
    }

    var CAR_COLORS = ["#d94f3d", "#2b7fd4", "#f2f5f7", "#e8a812", "#39b5a8", "#8d99a6", "#e4572e", "#4a5f8a"];
    function renderFlat(c) {
      var WORLD = SIZE + 4, B = 2;
      var g = document.getElementById("flatGrid");
      g.innerHTML = "";
      for (var wy = 0; wy < WORLD; wy++) {
        for (var wx = 0; wx < WORLD; wx++) {
          var inCity = wx >= B && wx < B + SIZE && wy >= B && wy < B + SIZE;
          if (!inCity) {
            var t = terrainAt(wx, wy);
            var cell = document.createElement("div");
            cell.className = "terrain " + t.cls;
            cell.textContent = t.txt;
            cell.title = t.cls.indexOf("forest") === 0 ? "城外森林" : t.cls === "waste" ? "城外荒地" : t.cls === "scrub" ? "城外灌木荒地" : "城外岩石地";
            g.appendChild(cell);
            continue;
          }
          (function (i2) {
            var b = S.grid[i2];
            var btn = document.createElement("button");
            if (b) {
              var d = DEFS[b.type];
              var body = "#" + d.color.toString(16).padStart(6, "0");
              var roof = "#" + d.roof.toString(16).padStart(6, "0");
              btn.style.background = body;
              btn.innerHTML = "<span class='bt-roof' style='background:" + roof + "'></span>" +
                "<span class='bt-name'>" + SHORT[b.type] + "</span>" +
                "<span class='bt-lv'>Lv" + b.level + "</span>";
              btn.title = d.name + " Lv" + b.level;
            } else {
              btn.className = "empty";
              btn.textContent = "·";
              btn.title = "空地（草坪）";
            }
            if (b && RES_TYPES[b.type] && c.resInfo[i2] && c.resInfo[i2].remain > 0) btn.classList.add("polluted");
            if (i2 === selected) btn.classList.add("sel");
            btn.addEventListener("click", function () { selectTile(i2); });
            g.appendChild(btn);
          })(idx(wx - B, wy - B));
        }
      }
      /* vehicles layer */
      var vi = vehicleInfo(c);
      var layer = document.getElementById("flatCars");
      layer.innerHTML = "";
      if (vi.unlocked) {
        var roads = buildingRoads();
        /* spread cars evenly over building-adjacent roads */
        var step = Math.max(1, Math.floor(roads.length / Math.max(1, vi.count)));
        for (var k = 0; k < vi.count && k * step < roads.length; k++) {
          var r = roads[k * step];
          var car = document.createElement("div");
          car.className = "flat-car" + (r.horiz ? "" : " vert");
          car.style.left = (r.x / WORLD * 100) + "%";
          car.style.top = (r.y / WORLD * 100) + "%";
          var bodyEl = document.createElement("div");
          bodyEl.className = "car-body";
          bodyEl.style.background = CAR_COLORS[k % CAR_COLORS.length];
          bodyEl.style.animationDelay = (k * 0.4) + "s";
          car.appendChild(bodyEl);
          layer.appendChild(car);
        }
      }
      var meta = document.getElementById("flatMeta");
      if (vi.unlocked) {
        meta.innerHTML = "<strong>车辆：</strong>已出现 " + layer.children.length + " 辆，沿着建筑旁边的街道行驶（人口 " + S.pop + " · 建筑 " + vi.total + " 栋）。";
      } else {
        meta.innerHTML = "<strong>车辆：</strong>暂无车辆——人口达到 " + VEH_POP_MIN + " 且建筑达到 " + VEH_BLD_MIN + " 栋后，车才会出现在建筑附近的街道上（当前人口 " + S.pop + " / " + VEH_POP_MIN + " · 建筑 " + vi.total + " / " + VEH_BLD_MIN + " 栋）。城外一圈是森林与荒地，城市只能在中间 12×12 的格子里扩建。";
      }
    }

    function renderLog() {
      document.getElementById("cityLog").innerHTML = S.log.map(function (t) { return "<li></li>"; }).join("");
      var lis = document.getElementById("cityLog").children;
      S.log.forEach(function (t, i2) { lis[i2].textContent = t; });
    }

    function refresh() {
      var c = compute();
      renderStatsBar(c);
      renderTilePanel(c);
      renderStatsTab(c);
      renderSatTab(c);
      renderNeedsTab(c);
      renderFlat(c);
      renderLog();
      syncThree(c);
    }

    /* ---------------- save code (static edition) ---------------- */
    function exportCode() {
      var data = { v: 1, funds: S.funds, month: S.month, pop: S.pop, reputation: S.reputation,
                   grid: S.grid, recentEvents: S.recentEvents, log: S.log, totalEvents: S.totalEvents };
      return btoa(unescape(encodeURIComponent(JSON.stringify(data))));
    }
    function importCode(str) {
      var data = JSON.parse(decodeURIComponent(escape(atob(str.trim()))));
      if (!data || !Array.isArray(data.grid) || data.grid.length !== N) throw new Error("bad save");
      S = { funds: +data.funds || 0, month: +data.month || 1, pop: +data.pop || 0,
            reputation: Math.max(-25, Math.min(25, +data.reputation || 0)),
            grid: data.grid.map(function (b) {
              return b && DEFS[b.type] ? { type: b.type, level: Math.max(1, Math.min(MAXLV, +b.level || 1)) } : null;
            }),
            recentEvents: Array.isArray(data.recentEvents) ? data.recentEvents : [],
            log: Array.isArray(data.log) ? data.log : [], totalEvents: +data.totalEvents || 0 };
      selected = -1;
      /* drop cached 3D models so they rebuild */
      if (three.ok) {
        for (var i = 0; i < N; i++) {
          if (tileGroups[i]) { scene.remove(tileGroups[i]); tileGroups[i] = null; }
          if (markerSprites[i]) { scene.remove(markerSprites[i]); markerSprites[i] = null; }
        }
      }
    }

    /* ---------------- wiring ---------------- */
    document.querySelectorAll(".tab").forEach(function (tab) {
      tab.addEventListener("click", function () {
        document.querySelectorAll(".tab").forEach(function (t) { t.setAttribute("aria-selected", "false"); });
        tab.setAttribute("aria-selected", "true");
        ["stats", "sat", "needs", "flat", "save"].forEach(function (k) {
          document.getElementById("tab-" + k).hidden = k !== tab.getAttribute("data-tab");
        });
      });
    });
    document.getElementById("btnNextMonth").addEventListener("click", nextMonth);
    document.getElementById("btnResetCam").addEventListener("click", function () {
      camTheta = Math.PI / 4; camPhi = 0.95; camR = 19;
    });
    var newGameArmed = false;
    document.getElementById("btnNewGame").addEventListener("click", function () {
      var btn = this;
      if (!newGameArmed) {
        newGameArmed = true; btn.textContent = "再点一次确认重开";
        setTimeout(function () { newGameArmed = false; btn.textContent = "重新开始"; }, 3000);
        return;
      }
      S = newState(); selected = -1; newGameArmed = false; btn.textContent = "重新开始";
      if (three.ok) {
        for (var i = 0; i < N; i++) {
          if (tileGroups[i]) { scene.remove(tileGroups[i]); tileGroups[i] = null; }
          if (markerSprites[i]) { scene.remove(markerSprites[i]); markerSprites[i] = null; }
        }
      }
      toast("新城市已成立。");
      refresh();
    });
    document.getElementById("btnExport").addEventListener("click", function () {
      document.getElementById("saveCode").value = exportCode();
      document.getElementById("saveMsg").textContent = "存档码已生成，复制后自己收好。";
    });
    document.getElementById("btnCopyCode").addEventListener("click", function () {
      var ta = document.getElementById("saveCode");
      if (!ta.value) { document.getElementById("saveMsg").textContent = "先点「导出存档码」。"; return; }
      ta.select();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(ta.value).then(function () {
          document.getElementById("saveMsg").textContent = "已复制到剪贴板。";
        }, function () { document.getElementById("saveMsg").textContent = "自动复制失败，长按文本框手动复制。"; });
      } else {
        try { document.execCommand("copy"); document.getElementById("saveMsg").textContent = "已复制到剪贴板。"; }
        catch (e) { document.getElementById("saveMsg").textContent = "自动复制失败，长按文本框手动复制。"; }
      }
    });
    document.getElementById("btnImport").addEventListener("click", function () {
      var v = document.getElementById("saveCode").value;
      if (!v.trim()) { document.getElementById("saveMsg").textContent = "先把存档码粘贴到文本框里。"; return; }
      try {
        importCode(v);
        document.getElementById("saveMsg").textContent = "导入成功，接着玩吧。";
        toast("存档导入成功。");
        refresh();
      } catch (e) {
        document.getElementById("saveMsg").textContent = "这串存档码读不了，检查一下有没有复制完整。";
      }
    });

    initThree();
    refresh();
    if (three.ok) setTimeout(resizeThree, 60);
</script>
</body>
</html>
